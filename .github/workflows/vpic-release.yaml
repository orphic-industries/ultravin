# One vPIC month in, one GitHub release out, and only past NHTSA's own procedure.
#
#   detect   which month to build: on a schedule or a dispatch, the newest month
#            NHTSA publishes (scripts/refresh.py detect); on a pull request, the
#            month vpic/manifest.json pins
#   data     download the month's dump, record its SHA-256, run the importer on a
#            new month, and build vpic.rkyv through the build-data action, which
#            checks the dump against dump_sha256 and the artifact against
#            artifact_blake3
#   wheels   three abi3 wheels: linux x86_64 (manylinux_2_17), linux aarch64
#            (manylinux_2_28), macOS arm64
#   compare  the linux x86_64 wheel against NHTSA's unmodified spvindecode in the
#            Postgres oracle, on VINs the wheel generates from its own data
#            (scripts/parity/release_gate.py); any difference fails the run
#   pull-request
#            a new month found on master: a data/vpic-<month> branch and a pull
#            request into master, which a person merges; nothing is published
#   publish  on master only, for the month master's manifest pins, when the
#            comparison passed and no release of that month exists: a GitHub
#            release with the three wheels and their SHA-256 sums
#
# A pull request runs every job up to and including compare, and neither opens
# a pull request nor publishes. Nothing here merges a pull request or uploads to
# a package index. Dependencies install from the lock files as they are
# (UV_FROZEN, cargo --locked). See README.md, "This fork".
name: vPIC Release

on:
  schedule:
    - cron: "23 20 * * *" # daily 20:23 UTC; NHTSA uploads land 13:15-19:16 UTC, day 9-18
  workflow_dispatch:
    inputs:
      month:
        description: "Build this YYYY_MM instead of probing NHTSA"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/vpic-release.yaml
      - .github/actions/build-data/**
      - .github/stamp-version.sh
      - scripts/parity/**
      - scripts/oracle.sh
      - docker-compose.yml
      - vpic/**

env:
  # CVE-2026-111943: Node runs every action and has its own compiled-in roots,
  # which still trust the leaked eMudhra keys. Make it read this bundle instead,
  # which each job's first step cleans.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  UV_FROZEN: "1"
  # The upstream release this fork's code is. A month's tag is
  # v<UPSTREAM_VERSION>-vpic<YYYY_MM> and its wheel version
  # <UPSTREAM_VERSION>+vpic.<YYYY>.<MM>. Change it when upstream code is merged.
  UPSTREAM_VERSION: "3.0.2"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a pull request's dry run. On master a run that may
  # publish is never cancelled halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      month: ${{ steps.pick.outputs.month }}
      new: ${{ steps.pick.outputs.new }}
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - name: Distrust the leaked eMudhra CA keys (CVE-2026-111943)
        run: sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf && sudo update-ca-certificates --fresh >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe NHTSA for a newer dump
        id: detect
        if: github.event_name != 'pull_request'
        env:
          FORCE_MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$FORCE_MONTH" ]; then
            python3 scripts/refresh.py detect --month "$FORCE_MONTH"
          else
            python3 scripts/refresh.py detect
          fi
      - name: Pick the month, the tag and what runs
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FOUND: ${{ steps.detect.outputs.month }}
          REASON: ${{ steps.detect.outputs.reason }}
        run: |
          set -euo pipefail
          pinned=$(jq -r .month vpic/manifest.json)
          # A month other than the pin, or the pin re-issued with other bytes, is
          # new data: it goes to a pull request and is never published from here.
          if [ -z "$FOUND" ] || { [ "$FOUND" = "$pinned" ] && [ "$REASON" != "reissue" ]; }; then
            month=$pinned new=false
          else
            month=$FOUND new=true
          fi
          tag="v${UPSTREAM_VERSION}-vpic${month}"
          version="${UPSTREAM_VERSION}+vpic.${month/_/.}"
          released=false
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            released=true
          fi
          open_pr=0
          if [ "$new" = true ]; then
            open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "data/vpic-$month" --state open --json number --jq length)
          fi

          build=true
          if [ "$EVENT" = schedule ]; then
            # A daily run builds only when there is something to do: a new month
            # with no pull request yet, or a pinned month with no release yet.
            if [ "$new" = true ] && [ "$open_pr" != 0 ]; then build=false; fi
            if [ "$new" = false ] && [ "$released" = true ]; then build=false; fi
          fi
          publish=false
          if [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/master ] && [ "$new" = false ] && [ "$released" = false ]; then
            publish=true
          fi

          {
            echo "month=$month"
            echo "new=$new"
            echo "tag=$tag"
            echo "version=$version"
            echo "build=$build"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### vPIC $month"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| pinned month | \`$pinned\` |"
            echo "| new data | $new |"
            echo "| tag | \`$tag\` (released: $released) |"
            echo "| open data pull request | $open_pr |"
            echo "| builds | $build |"
            echo "| publishes | $publish |"
          } >> "$GITHUB_STEP_SUMMARY"

  data:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MONTH: ${{ needs.detect.outputs.month }}
      NEW: ${{ needs.detect.outputs.new }}
    steps:
      - name: Distrust the leaked eMudhra CA keys (CVE-2026-111943)
        run: sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf && sudo update-ca-certificates --fresh >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Rust cache in the release lane: this job compiles the importer that
      # writes the artifact every wheel embeds, so a restored cache must not be
      # able to steer it.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Download the dump and record its SHA-256
        id: dump
        run: |
          set -euo pipefail
          make download MONTH="$MONTH"
          path="downloads/vPICList_lite_${MONTH}.plain.zip"
          sha=$(sha256sum "$path" | cut -d' ' -f1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$sha  vPICList_lite_${MONTH}.plain.zip" | tee "$RUNNER_TEMP/dump.sha256"
          {
            echo "### vPIC $MONTH dump"
            echo
            echo "SHA-256 \`$sha\`, $(stat -c %s "$path") bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      # On a new month the importer rewrites vpic/ and crates/ultravin/data/, so
      # manifest.json then pins this download. The pinned month keeps the
      # committed manifest, and build-data refuses a download that differs from it.
      - name: Import the new month
        if: env.NEW == 'true'
        env:
          DUMP: ${{ steps.dump.outputs.path }}
        run: make data DUMP="$DUMP" MONTH="$MONTH"
      - uses: ./.github/actions/build-data
        with:
          dump: ${{ steps.dump.outputs.path }}
      - name: Record the artifact
        env:
          DUMP_SHA256: ${{ steps.dump.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(jq -r .month vpic/manifest.json)" = "$MONTH"
          test "$(jq -r .dump_sha256 vpic/manifest.json)" = "$DUMP_SHA256"
          echo "artifact BLAKE3 \`$(jq -r .artifact_blake3 vpic/manifest.json)\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vpic-data
          path: |
            crates/ultravin/data/vpic.rkyv
            crates/ultravin/data/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vpic-dump
          path: ${{ steps.dump.outputs.path }}
          if-no-files-found: error
      # The committed text a new month changes, for the pull-request job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.NEW == 'true'
        with:
          name: vpic-tree
          path: |
            vpic/
            crates/ultravin/data/manifest.json
          if-no-files-found: error

  # The shape of upstream's release matrix, cut to three rows. abi3 means one
  # wheel per platform serves Python 3.10+.
  wheels:
    name: wheels (${{ matrix.kind }}, ${{ matrix.target }})
    needs: [detect, data]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SSL_CERT_FILE: ${{ (matrix.kind == 'macos' && '/etc/ssl/cert.pem') || '/etc/ssl/certs/ca-certificates.crt' }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.detect.outputs.version }}
      MONTH: ${{ needs.detect.outputs.month }}
      PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux auto is manylinux2014, which is manylinux_2_17 on x86_64.
          - { kind: linux, runner: ubuntu-22.04, target: x86_64, manylinux: auto, platform: manylinux_2_17_x86_64.manylinux2014_x86_64, smoke: true }
          # The default cross-gcc predates -Wdate-time, which mimalloc's C build
          # needs on aarch64; the 2.28 cross image ships a modern gcc.
          - { kind: linux, runner: ubuntu-22.04, target: aarch64, manylinux: manylinux_2_28, platform: manylinux_2_28_aarch64 }
          - { kind: macos, runner: macos-14, target: aarch64, manylinux: auto, platform: macosx_11_0_arm64, smoke: true }
    steps:
      - name: Distrust the leaked eMudhra CA keys (CVE-2026-111943)
        if: runner.os == 'Linux'
        run: sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf && sudo update-ca-certificates --fresh >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Distrust the leaked eMudhra CA keys (macOS)
        if: runner.os != 'Linux'
        run: python3 scripts/distrust_emudhra.py
      # After the data job, never before: the importer records the crate version
      # in the artifact, so a stamped importer would build other bytes.
      - name: Stamp the month's version
        run: ./.github/stamp-version.sh "$TAG"
      # The artifact and the manifest the data job built. build.rs embeds the
      # artifact and reads the month from the manifest for provenance().
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vpic-data
          path: crates/ultravin/data
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          sccache: false
          manylinux: ${{ matrix.manylinux }}
          # The Ubuntu-based cross image still trusts the leaked eMudhra keys
          # (CVE-2026-111943), so lend it the runner's cleaned store. Not the
          # pypa image (linux x86_64), which already refuses them and keeps
          # /etc/ssl/certs as links into /etc/pki. Ignored off Linux.
          docker-options: ${{ (matrix.kind == 'linux' && matrix.target != 'x86_64') && '-v /etc/ssl/certs:/etc/ssl/certs:ro' || '' }}
      - name: Check the wheel's name
        run: |
          set -euo pipefail
          want="dist/ultravin-${VERSION}-cp310-abi3-${PLATFORM}.whl"
          ls -l dist
          test "$(ls dist)" = "$(basename "$want")" || {
            echo "::error::expected exactly $want"
            exit 1
          }
      # Fingerprint dist/ as built, outside dist/. The smoke below installs from
      # the network; the verify step before upload re-lists the digests, so a
      # wheel changed, added or removed in that window never reaches the release.
      - name: Record dist digests
        run: shasum -a 256 dist/* > "$RUNNER_TEMP/dist.sha256"
      - name: Set up Python for smoke
        if: matrix.smoke
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Smoke test the built wheel
        if: matrix.smoke
        env:
          ULTRAVIN_EXPECT_VERSION: ${{ needs.detect.outputs.version }}
        run: python3 scripts/wheel_smoke.py dist/*.whl
      - name: Check provenance() names the month
        if: matrix.smoke
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/prov"
          "$RUNNER_TEMP/prov/bin/pip" install --quiet --disable-pip-version-check --no-deps dist/*.whl
          "$RUNNER_TEMP/prov/bin/python" -I - <<'PY'
          import json
          import os

          import ultravin

          p = ultravin.provenance()
          print(json.dumps(p))
          manifest = json.load(open("crates/ultravin/data/manifest.json"))
          assert p["data_month"] == os.environ["MONTH"], p
          assert p["artifact_blake3"] == manifest["artifact_blake3"], p
          assert p["decoder_version"] == os.environ["VERSION"], p
          PY
      - name: Note wheel not smoked (cross-compiled)
        if: ${{ !matrix.smoke }}
        run: echo "::notice::${{ matrix.kind }}/${{ matrix.target }} wheel is cross-compiled for another architecture, built, not smoked"
      - name: Verify dist unchanged since build
        run: shasum -a 256 dist/* | diff - "$RUNNER_TEMP/dist.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.kind }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  compare:
    needs: [detect, data, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Distrust the leaked eMudhra CA keys (CVE-2026-111943)
        run: sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf && sudo update-ca-certificates --fresh >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: echo "UV_PYTHON=$pythonLocation" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vpic-dump
          path: downloads
      # The gate's own dependencies (psycopg) without building this checkout:
      # every decode it compares comes from the wheel.
      - run: uv sync --no-install-project
      - name: Start the oracle
        run: make oracle-up
      # ULTRAVIN_ORACLE_FAST_PROCS stays unset, so the oracle runs the dump's own
      # spvindecode text; the gate refuses an oracle that holds the rewrite.
      - name: Load the dump into the oracle
        env:
          MONTH: ${{ needs.detect.outputs.month }}
        run: make oracle-load DUMP="downloads/vPICList_lite_${MONTH}.plain.zip"
      - name: Compare the wheel with spvindecode
        env:
          UV_NO_SYNC: "1"
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          make release-gate WHEEL="$wheel" 2>&1 | tee "$RUNNER_TEMP/gate.txt"
          {
            echo "### Comparison with spvindecode"
            echo
            echo '```'
            grep '^release-gate:' "$RUNNER_TEMP/gate.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    needs: [detect, data, compare]
    if: needs.detect.outputs.new == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch ci.yaml on the branch: a GITHUB_TOKEN push starts no workflow
    env:
      MONTH: ${{ needs.detect.outputs.month }}
      TAG: ${{ needs.detect.outputs.tag }}
      BRANCH: data/vpic-${{ needs.detect.outputs.month }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Distrust the leaked eMudhra CA keys (CVE-2026-111943)
        run: sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf && sudo update-ca-certificates --fresh >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # vpic/ is replaced whole, so a file the new month drops is deleted too.
      - run: rm -rf vpic
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vpic-tree
          path: .
      - name: Commit the month and open the pull request
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A vpic crates/ultravin/data/manifest.json
          git commit -m "data: NHTSA vPIC $MONTH"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "NHTSA vPIC \`$MONTH\`, imported by the vPIC Release workflow."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| source | $(jq -r .source_url vpic/manifest.json) |"
            echo "| dump SHA-256 | \`$(jq -r .dump_sha256 vpic/manifest.json)\` |"
            echo "| artifact BLAKE3 | \`$(jq -r .artifact_blake3 vpic/manifest.json)\` |"
            echo "| run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "The run built three wheels of this month, and the linux x86_64 wheel"
            echo "matched NHTSA's unmodified \`spvindecode\` on every VIN the gate compared."
            echo
            echo "This branch carries only the importer's output. \`make refresh MONTH=$MONTH\`"
            echo "re-freezes \`tests/parity_corpus.json\` and runs the refresh gates"
            echo "(docs/DATA_REFRESH.md); push its changes here if CI is red."
            echo
            echo "Once a person merges this, the next run on master publishes \`$TAG\`."
          } > "$RUNNER_TEMP/body.md"
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "data: NHTSA vPIC $MONTH" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::could not open the pull request. Open it by hand: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/master...$BRANCH (GitHub Actions may need permission to create pull requests: Settings > Actions > General)"
            exit 1
          fi
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  publish:
    needs: [detect, wheels, compare]
    if: needs.detect.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
    env:
      MONTH: ${{ needs.detect.outputs.month }}
      TAG: ${{ needs.detect.outputs.tag }}
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Distrust the leaked eMudhra CA keys (CVE-2026-111943)
        run: sudo sed -i 's|^mozilla/emSign_ECC_Root_CA_-_G3\.crt$|!&|' /etc/ca-certificates.conf && sudo update-ca-certificates --fresh >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          test "$(jq -r .month vpic/manifest.json)" = "$MONTH"
          test "$(find dist -name '*.whl' | wc -l)" = 3
          (cd dist && sha256sum ./*.whl | sed 's| \./| |') > SHA256SUMS
          cat SHA256SUMS
          {
            echo "ultravin $VERSION: the decoder with NHTSA vPIC \`$MONTH\` embedded."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| source | $(jq -r .source_url vpic/manifest.json) |"
            echo "| dump SHA-256 | \`$(jq -r .dump_sha256 vpic/manifest.json)\` |"
            echo "| artifact BLAKE3 | \`$(jq -r .artifact_blake3 vpic/manifest.json)\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |"
            echo
            echo "The linux x86_64 wheel matched NHTSA's unmodified \`spvindecode\` on"
            echo "every VIN the release gate compared."
            echo
            echo "Wheel SHA-256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/*.whl SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md
